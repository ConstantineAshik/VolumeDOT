name: Build VolumeDot Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  fdroid-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install F-Droid tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmagic1
          python -m pip install fdroidserver==2.4.5
      - name: Validate F-Droid metadata
        working-directory: fdroid
        run: |
          fdroid readmeta
          fdroid lint com.ashik.floatvol

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check F-Droid listing assets
        run: node scripts/check-fdroid-metadata.mjs

      - name: Test, lint and build unsigned release and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease assembleDebug -Pfdroid=true

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDot-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
